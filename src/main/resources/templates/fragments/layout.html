<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>
</head>
<body>

<div class="app-shell">
    <aside class="sidebar" th:fragment="sidebar(active)">
        <div class="brand-row">
            <div class="brand-mark">M</div>
            <div>
                <div style="font-weight:700;font-size:1.15rem;color:var(--navy);">MediCare AI</div>
                <div class="eyebrow">Smart Health Hub</div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a th:classappend="${active == 'dashboard' ? 'active' : ''}" href="/dashboard">
                <span>📊</span> Dashboard
            </a>
            <a th:classappend="${active == 'medicines' ? 'active' : ''}" href="/medicines">
                <span>💊</span> Medicines
            </a>
            <a th:classappend="${active == 'appointments' ? 'active' : ''}" href="/appointments">
                <span>📅</span> Appointments
            </a>
            <a th:classappend="${active == 'doctors' ? 'active' : ''}" href="/doctors">
                <span>🩺</span> Doctors
            </a>
            <a th:classappend="${active == 'assistant' ? 'active' : ''}" href="/assistant">
                <span>💬</span> AI Assistant
            </a>
            <a th:classappend="${active == 'caregivers' ? 'active' : ''}" href="/caregivers">
                <span>🛡️</span> Caregivers
            </a>
            <a th:classappend="${active == 'settings' ? 'active' : ''}" href="/settings/notifications">
                <span>⚙️</span> Settings
            </a>
            <a th:classappend="${active == 'reports' ? 'active' : ''}" href="/reports">
                <span>📈</span> Reports
            </a>
        </nav>
        <div class="sidebar-footer">
            <form method="post" action="/logout" style="margin:0;">
                <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : ''}" th:value="${_csrf != null ? _csrf.token : ''}" />
                <button class="btn btn-ghost btn-block" style="text-align:left;">Logout</button>
            </form>
        </div>
    </aside>

    <div class="main-panel">
        <header class="topbar" th:fragment="topbar(title)">
            <div>
                <span class="eyebrow" th:text="${title != null ? title : 'Connected System'}">Connected System</span>
                <div style="font-weight:700;color:var(--navy);">MediCare AI Platform</div>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
                <form method="post" action="/logout" style="display:inline">
                    <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : ''}" th:value="${_csrf != null ? _csrf.token : ''}" />
                    <button class="btn btn-ghost">Logout</button>
                </form>
            </div>
        </header>
        <main class="page-content">
            <section layout:fragment="content"></section>
        </main>
    </div>
</div>

<script type="module" th:src="@{/js/app.js}"></script>
</body>
</html>

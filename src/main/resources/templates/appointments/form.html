<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head><title>Book Appointment - MediCare AI</title></head>
<body>
<section layout:fragment="content">
    <div class="card hero-card" style="min-height:auto;margin-bottom:20px;">
        <div>
            <span class="eyebrow">Consultation Booking</span>
            <h3>Book Appointment</h3>
            <p class="muted" th:text="${doctor != null ? 'With ' + doctor.fullName + ' — ' + doctor.specialty : 'Select Doctor'}">Doctor Name</p>
        </div>
    </div>

    <div class="card form-card">
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form method="post" action="/appointments" th:object="${form}">
            <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : ''}" th:value="${_csrf != null ? _csrf.token : ''}" />
            <input type="hidden" name="doctorId" th:value="${doctor != null ? doctor.id : form.doctorId}" />

            <div class="form-row two-up">
                <div class="form-group">
                    <label for="appointmentDate">Appointment Date</label>
                    <input type="date" id="appointmentDate" name="appointmentDate" th:value="*{appointmentDate}" required />
                </div>
                <div class="form-group">
                    <label for="appointmentTime">Appointment Time</label>
                    <input type="time" id="appointmentTime" name="appointmentTime" th:value="*{appointmentTime}" required />
                </div>
            </div>

            <div class="form-group">
                <label for="reason">Reason for Visit (optional)</label>
                <textarea id="reason" name="reason" rows="3" maxlength="500" placeholder="Briefly describe your symptoms or reason for scheduling..." th:text="*{reason}"></textarea>
            </div>

            <div style="display:flex;gap:12px;margin-top:20px;">
                <button class="btn btn-primary">Confirm Booking</button>
                <a class="btn btn-ghost" href="/doctors">Cancel</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
